name: Build Android Rejoin APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android Unit Tests & Build APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle testDebugUnitTest assembleDebug --no-daemon --console=plain > gradle.log 2>&1; then
            cat gradle.log
            (grep -A 6 -E "^e:|FAILURE:|What went wrong:" gradle.log || tail -n 10 gradle.log) | head -n 8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat gradle.log
          cp app/build/outputs/apk/debug/app-debug.apk ../rejoin-control.apk

      - name: Upload Rejoin Control APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rejoin-control-apk
          path: rejoin-control.apk
          if-no-files-found: error

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rejoin Control APK (Latest)
          files: rejoin-control.apk
          make_latest: true
          body: "Tải trực tiếp `rejoin-control.apk` để cài trên Redfinger (thay thế hoàn toàn Termux)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
