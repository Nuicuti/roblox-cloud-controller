name: Build Android Rejoin APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android Unit Tests & Build APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload Rejoin Control APK
        uses: actions/upload-artifact@v4
        with:
          name: rejoin-control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
